<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thư viện tài liệu và bài đào tạo của TechAI SBS.">
  <title>Thư viện tài liệu · TechAI SBS</title>
  <script>
    function redirectTrainingLink() {
      if (['#trang-chu', '#mat-khau', '#phishing'].includes(location.hash)) {
        location.replace('training-bao-mat.html' + location.hash);
      }
    }
    window.addEventListener('hashchange', redirectTrainingLink);
    redirectTrainingLink();
  </script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #09111b; color: #e7eef8; --muted: #a9b9cf; --line: #2a3b50; --accent: #78edc8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--line); }
    .brand { display: inline-block; padding-block: 20px; color: var(--accent); text-decoration: none; font-weight: 800; }
    main { padding-block: clamp(36px, 7vw, 76px); }
    h1 { margin: 0 0 30px; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.1; letter-spacing: -.04em; }
    h2 { margin: 0 0 18px; font-size: 1.25rem; }
    .library { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel { padding: clamp(16px, 3vw, 24px); background: #101d2d; border: 1px solid var(--line); border-radius: 14px; }
    .category { display: block; padding: 10px 12px; border-left: 3px solid var(--accent); border-radius: 6px; background: #152c37; color: var(--accent); font-weight: 700; text-decoration: none; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .9rem; }
    td { line-height: 1.55; }
    td a { color: var(--accent); font-weight: 700; text-underline-offset: 4px; }
    :focus-visible { outline: 3px solid #a4c8ff; outline-offset: 4px; }
    @media (max-width: 700px) { .library { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap"><a class="brand" href="./">◈ TECHAI SBS</a></div>
  </header>
  <main class="wrap">
    <h1>Thư viện tài liệu</h1>
    <div class="library">
      <nav class="panel" aria-labelledby="category-title">
        <h2 id="category-title">Loại tài liệu</h2>
        <a class="category" href="#bao-mat-thong-tin">Bảo mật thông tin</a>
      </nav>
      <section class="panel" id="bao-mat-thong-tin" aria-labelledby="security-title">
        <h2 id="security-title">Bảo mật thông tin</h2>
        <table aria-labelledby="security-title">
          <thead>
            <tr><th scope="col">Tài liệu</th><th scope="col">Nội dung</th></tr>
          </thead>
          <tbody>
            <tr>
              <td><a href="training-bao-mat.html">Đào tạo bảo mật thông tin</a></td>
              <td>10 slide nhận thức an toàn thông tin và hai bài mô phỏng dò mật khẩu, nhận diện phishing.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</body>
</html>
