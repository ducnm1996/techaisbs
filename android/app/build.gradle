plugins { id 'com.android.application' }
android {
 namespace 'sbs.techai.metadata'
 compileSdk 36
 buildFeatures { buildConfig true }
 sourceSets { main.assets.srcDirs += ['../third-party'] }
 defaultConfig { applicationId 'sbs.techai.metadata'; minSdk 29; targetSdk 36; versionCode 3; versionName '0.3.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false; debuggable false } }
 lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
 implementation files('libs/hev-socks5-tunnel-2.20.0.aar')
 implementation 'androidx.work:work-runtime:2.10.1'
 testImplementation 'junit:junit:4.13.2'
}
