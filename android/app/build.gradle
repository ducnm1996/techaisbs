plugins { id 'com.android.application' }
android {
 namespace 'sbs.techai.metadata'
 compileSdk 36
 defaultConfig { applicationId 'sbs.techai.metadata'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false; debuggable false } }
 lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
 implementation 'androidx.work:work-runtime:2.10.1'
 testImplementation 'junit:junit:4.13.2'
}
